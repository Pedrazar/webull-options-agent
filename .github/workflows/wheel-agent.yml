name: Wheel agent

# One short job per tick, not one long-running job per day (unlike the
# sibling webull-agent project's "agent.yml") — this strategy only needs a
# check every 15 minutes, so keeping each run to a couple minutes keeps
# total monthly Actions minutes comfortably inside GitHub's free tier on a
# private repo (~26 runs/trading-day * ~1 min each ≈ 520 min/month, vs.
# ~350 min/day for a held-open job).
#
# The actual 15-minute cadence during market hours is driven entirely by
# an external cron-job.org job hitting this workflow's `workflow_dispatch`
# REST endpoint (see below) — this file has no `schedule:` trigger of its
# own. cron-job.org's schedule is wider than the exact market session with
# margin on both ends (roughly 6:00am-2:00pm Pacific, weekdays), so
# tickOnce.ts's own isMarketOpenNow() check no-ops any run outside the real
# 9:30am-4:00pm ET session — cheap, exits almost immediately.
#
# CONFIRMED LIVE 2026-09-17: the sibling project's documented GitHub
# scheduled-trigger delay hit here too — only 3 of the expected ~26 runs
# fired that day, 3 hours apart instead of 15 minutes, missing the first
# ~4 hours of the session entirely. Fixed 2026-09-17 the same way the
# sibling project did: an external cron-job.org job hitting this
# workflow's `workflow_dispatch` REST endpoint every 15 minutes (not
# subject to the delay) using a fine-grained PAT scoped to just this repo.
#
# CONFIRMED LIVE 2026-09-18: keeping the native `schedule:` trigger as a
# "harmless backup" was NOT harmless — it's aligned to the same 15-minute
# boundaries as the cron-job.org trigger, so the two collided within
# seconds of each other at 17:00 UTC. `concurrency` below correctly
# serialized them (no parallel tick() calls, no double-order risk), but
# the second run's commit-back step still hit a genuine `git rebase`
# conflict on wheel-state.json and failed outright (no trading impact —
# that tick was just a routine "hold" check, nothing lost). Removed the
# `schedule:` trigger entirely rather than patching the commit logic,
# since cron-job.org alone already proved reliable (35 of 36 runs
# succeeded on 2026-09-18, the one failure being exactly this collision)
# and a redundant trigger firing on the exact same cadence has no real
# backup value anyway.
on:
  workflow_dispatch: {}

concurrency:
  group: wheel-agent
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm ci

      - name: Run one tick
        env:
          WEBULL_APP_KEY: ${{ secrets.WEBULL_APP_KEY }}
          WEBULL_APP_SECRET: ${{ secrets.WEBULL_APP_SECRET }}
          WEBULL_BASE_URL: ${{ secrets.WEBULL_BASE_URL }}
          WEBULL_SANDBOX_ACCOUNT_ID: ${{ secrets.WEBULL_SANDBOX_ACCOUNT_ID }}
          WHEEL_SYMBOL: NVDA
          WHEEL_CONTRACTS: "5"
          WHEEL_PUT_OTM_PCT: "0.10"
          WHEEL_CALL_ITM_PCT: "0.10"
          WHEEL_DTE_MIN: "14"
          WHEEL_DTE_MAX: "28"
          WHEEL_PROFIT_TAKE_PCT: "0.50"
        run: npx tsx tickOnce.ts

      # Runs even if the tick step failed, so a partial write isn't lost
      # with the ephemeral runner filesystem — same pattern as the sibling
      # project's agent.yml.
      - name: Commit state + trade log
        if: always()
        run: |
          git config user.name "webull-options-agent"
          git config user.email "actions@users.noreply.github.com"
          git add wheel-state.json wheel-trades.jsonl
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "wheel agent tick $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
